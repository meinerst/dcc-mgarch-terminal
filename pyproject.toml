[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dccmgarch"
version = "0.1.0"
description = "Clean, tested DCC-MGARCH intraday risk core (refactor of the 2022 thesis tool)"
requires-python = ">=3.10"
# Version RANGES only — the compatible window. Exact bit-reproduction of the golden
# masters (tests/golden/*.json, rel=1e-6) is pinned by requirements.lock, generated on
# the reference machine (see REPRODUCIBILITY.md). Upper caps below sit just under the
# majors that silently broke reproduction on a fresh install (numpy 2.x / pandas 3.x /
# arch 8.x — verified 2026-07-23): they keep drift down to sub-0.1% BLAS noise instead
# of large divergence, but ranges alone do NOT reproduce 1e-6 across machines.
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    # Capped at <1.16 for the same reason as the caps around it, and measured the same
    # way: on a fresh clone resolving to the top of these ranges, scipy 1.16.2 breaks the
    # GARCH scale-invariance property (alpha 0.0804 -> 0.1013 between a series and its x3
    # copy, tolerance 2e-2) that test_fixes.py::test_rescale_is_scale_only asserts.
    # 1.14.1 and 1.15.3 pass; verified 2026-07-27 in a clean venv.
    "scipy>=1.11,<1.16",
    "statsmodels>=0.14",
    "arch>=6.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
# Optional: a live per-scenario progress bar for the stress grind (run_stress30).
# NOT required — the driver imports it defensively and falls back to a text ETA line,
# so the overnight .bat (which installs nothing) runs fine without it. Anaconda ships
# tqdm by default, so the reference home PC gets the bars for free.
progress = [
    "tqdm>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "backtest", "tests", "private"]
# The recovered 2022 notebooks are an archive, not live code: they are kept exactly as
# they were found, so linting them would only ever produce noise to ignore.
extend-exclude = ["old-code-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# `slow` is one real fit (~10s on the reference PC, ~30s on the tablet), so it is opt-in:
#   pytest -m slow      run only it
#   pytest              the default suite, which deselects it
addopts = "-m 'not slow'"
markers = [
    "slow: runs a genuine one_step_var fit rather than stopping short of the model",
]
